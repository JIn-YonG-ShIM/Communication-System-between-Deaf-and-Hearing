<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SeeHear 디자인 편집기</title>
<style>
:root{--bg:#eef1ec;--panel:#fff;--ink:#1f2a24;--sub:#5d6b62;--line:#d9dfd8;--acc:#2f6b4f;--acc2:#e7f0ea;--warn:#b4541a}
@media (prefers-color-scheme:dark){:root{--bg:#161a17;--panel:#1f2521;--ink:#e9eee9;--sub:#9aa79e;--line:#333c35;--acc:#7fc29f;--acc2:#26342c;--warn:#f0a15f}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.top{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.top h1{font-size:15px;margin:0 8px 0 0;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 12px;cursor:pointer}
.seg button.on{background:var(--acc);color:#fff}
@media (prefers-color-scheme:dark){.seg button.on{color:#10231a}}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 12px;cursor:pointer}
.btn:hover{background:var(--acc2)}
.btn.prim{background:var(--acc);border-color:var(--acc);color:#fff}
@media (prefers-color-scheme:dark){.btn.prim{color:#10231a}}
.btn:disabled{opacity:.4;cursor:default}
.sp{flex:1}
.main{flex:1;min-height:0;display:flex}
.stage{flex:1;min-width:0;position:relative;overflow:hidden}
.frame{position:absolute;left:50%;top:50%;transform-origin:0 0;border-radius:18px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.25);background:#000}
.frame iframe{display:block;border:0;width:100%;height:100%;background:#fff}
.hint{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--sub);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 9px;max-width:calc(100% - 24px)}
.side{width:330px;flex:none;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:12px}
.side h2{font-size:13px;margin:16px 0 8px;color:var(--sub);font-weight:600}
.side h2:first-child{margin-top:0}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}
.row>label{width:84px;flex:none;color:var(--sub);font-size:13px}
.row input[type=number],.row input[type=text],.row select,.row textarea{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px}
.row textarea{resize:vertical;min-height:38px}
.row input[type=color]{width:38px;height:32px;padding:0;border:1px solid var(--line);border-radius:8px;background:none;flex:none}
.row input[type=range]{flex:1}
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;flex:1}
.four input{width:100%;text-align:center;padding:6px 2px!important}
.mini{font-size:12px;color:var(--sub);margin:4px 0}
.x{border:0;background:none;color:var(--sub);cursor:pointer;padding:2px 6px;border-radius:6px}
.x:hover{background:var(--acc2);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.sel{background:var(--acc2);border-radius:10px;padding:8px 10px;font-size:13px}
.sel b{display:block}
.sel code{font-size:11px;color:var(--sub);word-break:break-all}
.list{display:flex;flex-direction:column;gap:4px}
.item{display:flex;gap:6px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px}
.item span{flex:1;min-width:0;word-break:break-all;cursor:pointer}
.item em{color:var(--sub);font-style:normal}
.empty{color:var(--sub);font-size:13px;padding:14px 4px;text-align:center}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);max-width:520px;padding:18px}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog ol{padding-left:20px}
@media (max-width:820px){.side{width:280px}}
</style>
</head>
<body>
<div class="top">
  <h1>SeeHear 디자인 편집기</h1>
  <span class="seg" id="dev"><button data-d="cs">아이패드 (CS)</button><button data-d="bar">아이폰 (BAR)</button></span>
  <span class="seg" id="mode"><button data-m="use">앱 사용하기</button><button data-m="edit">고치기</button></span>
  <button class="btn" id="jump" title="로그인과 안내를 건너뛰고 메인 화면으로">메인 화면으로</button>
  <button class="btn" id="reload" title="앱을 처음 화면부터 다시 시작">처음부터</button>
  <span class="sp"></span>
  <button class="btn" id="undo" title="되돌리기">↶</button><button class="btn" id="redo" title="다시 하기">↷</button>
  <button class="btn" id="imp">불러오기</button>
  <button class="btn prim" id="exp">저장 파일 받기</button>
  <input type="file" id="impF" accept=".json,application/json" hidden>
</div>
<div class="main">
  <div class="stage" id="stage"><div class="frame" id="frame"><iframe id="fr" title="앱 화면"></iframe></div><div class="hint" id="hint"></div></div>
  <aside class="side" id="side"></aside>
</div>
<dialog id="dlg"></dialog>
<script>
'use strict';
const $ = s => document.querySelector(s);
const fr = $('#fr'), side = $('#side');
const SIZE = {cs:[1194,834], bar:[414,896]};
const STATE_CLS = new Set(['on','off','blink','sel','act','active','open','done','cur','now','typing','fresh','live','dim','hide','show','anim','hot','new','ok','warn','bad','wait','sent','land','darkcard','focus','pressed','checked','disabled']);
let dev = localStorage.getItem('dz-dev') || 'cs', mode = 'use';
let D = {v:1, css:[], text:[], add:[]}, undo = [], redo = [];
let cur = null, all = false, wide = false;      // cur: 고른 요소 / all: 같은 종류 모두 / wide: 모든 화면에
let W = null, doc = null, hov = null, box = null, drag = null;

// ---------- 화면 틀 ----------
function layout(){ const [w,h] = SIZE[dev], st = $('#stage'); const k = Math.min((st.clientWidth-40)/w, (st.clientHeight-40)/h, 1); const f = $('#frame'); f.style.width = w+'px'; f.style.height = h+'px'; f.style.transform = `scale(${k}) translate(-50%,-50%)`; }
addEventListener('resize', layout);
function open(){ cur = null; fr.src = `seehear-${dev}.html?edit=1&t=${Date.now()}#${dev==='cs'?'both':'phone'}`; document.querySelectorAll('#dev button').forEach(b=>b.classList.toggle('on', b.dataset.d===dev)); layout(); }
fr.addEventListener('load', ()=>{
  W = fr.contentWindow; doc = fr.contentDocument; if(!W || !W.Design){ hint('앱을 불러오지 못했어요. 이 편집기는 앱과 같은 주소(깃허브 페이지)에서 열어야 해요.'); return; }
  let d = null; try{ d = JSON.parse(localStorage.getItem(W.Design.DRAFT)); }catch(e){}
  const start = () => { D = Object.assign({v:1,css:[],text:[],add:[]}, JSON.parse(JSON.stringify(d || W.Design.get()))); undo = []; redo = []; hook(); panel(); };
  d ? start() : setTimeout(start, 900);     // 저장된 초안이 없으면 올려 둔 design 파일을 불러올 시간을 줌
});
function hint(t){ $('#hint').textContent = t; }
function setMode(m){ mode = m; document.querySelectorAll('#mode button').forEach(b=>b.classList.toggle('on', b.dataset.m===m)); if(m==='use'){ pick(null); } if(hov) hov.style.display='none'; hint(m==='use' ? '앱 사용하기: 평소처럼 눌러서 고치고 싶은 화면까지 가세요. 그다음 [고치기]를 누르세요.' : '고치기: 요소를 누르면 골라져요. 고른 요소는 끌어서 옮길 수 있어요.'); panel(); }

// ---------- 앱 안에 손 넣기 ----------
function hook(){
  const mk = (c) => { const e = doc.createElement('div'); e.setAttribute('data-dzui',''); e.style.cssText = `position:fixed;z-index:2147483647;pointer-events:none;display:none;border:2px ${c};border-radius:3px;box-sizing:border-box`; doc.body.appendChild(e); return e; };
  hov = mk('dashed #2f80ff'); box = mk('solid #ff5a1f'); box.style.boxShadow = '0 0 0 1px #fff';
  const stop = e => { if(mode!=='edit') return; e.preventDefault(); e.stopImmediatePropagation(); };
  ['click','dblclick','mousedown','mouseup','touchstart','touchend','submit'].forEach(t=>doc.addEventListener(t, stop, true));
  doc.addEventListener('pointermove', e=>{ if(mode!=='edit') return;
    if(drag){ const dx=(e.clientX-drag.x)/drag.k, dy=(e.clientY-drag.y)/drag.k; if(!drag.on && Math.hypot(dx,dy)<4) return; drag.on = true; drag.nx = Math.round(drag.ox+dx); drag.ny = Math.round(drag.oy+dy); cur.style.setProperty('translate', `${drag.nx}px ${drag.ny}px`, 'important'); frameBox(); return; }
    const t = target(e); place(hov, t && t!==cur ? t : null); }, true);
  doc.addEventListener('pointerdown', e=>{ if(mode!=='edit') return; e.preventDefault(); e.stopImmediatePropagation();
    const t = target(e); if(!t) return;
    if(!(cur && (t===cur || cur.contains(t)))) pick(t);
    const r = cur.getBoundingClientRect(), k = cur.offsetWidth ? r.width/cur.offsetWidth : 1; const [ox,oy] = getTr(cur);
    drag = {x:e.clientX, y:e.clientY, k:k||1, ox, oy, on:false}; }, true);
  const up = (e) => { if(mode==='edit' && e){ e.preventDefault(); e.stopImmediatePropagation(); } if(!drag) return; const d = drag; drag = null; if(d.on && cur){ cur.style.removeProperty('translate'); setProp('translate', `${d.nx}px ${d.ny}px`); panel(); } };
  doc.addEventListener('pointerup', up, true); doc.addEventListener('pointercancel', up, true);
  W.addEventListener('scroll', frameBox, true); W.addEventListener('resize', frameBox);
  clearInterval(hook.iv); hook.iv = setInterval(()=>{ if(cur && !doc.contains(cur)){ let e=null; try{ e = doc.querySelector(scopeSel(cur._scope)+cur._sel); }catch(x){} cur = null; if(e) pick(e, true); else { place(box,null); panel(); } } else frameBox(); }, 400);
}
function target(e){ let t = doc.elementFromPoint(e.clientX, e.clientY); if(!t || t===doc.body || t===doc.documentElement || t.hasAttribute('data-dzui')) return null; const a = t.closest('dz-el'); if(a) return a; while(t && t.namespaceURI!=='http://www.w3.org/1999/xhtml') t = t.parentElement; if(t && /^(svg|path|g)$/i.test(t.nodeName)) t = t.parentElement; return t; }
function place(b, el){ if(!b) return; if(!el){ b.style.display='none'; return; } const r = el.getBoundingClientRect(); Object.assign(b.style, {display:'block', left:r.left+'px', top:r.top+'px', width:r.width+'px', height:r.height+'px'}); }
function frameBox(){ place(box, cur && doc.contains(cur) ? cur : null); }
function getTr(el){ const t = W.getComputedStyle(el).translate; if(!t || t==='none') return [0,0]; const p = t.split(' ').map(parseFloat); return [p[0]||0, p[1]||0]; }

// ---------- 요소 이름표(선택자) ----------
const q = v => '"'+String(v).replace(/\\/g,'\\\\').replace(/"/g,'\\"')+'"';
function step(el, noNth){
  if(el.nodeName==='DZ-EL') return `dz-el[data-dz=${q(el.dataset.dz)}]`;
  let s = el.nodeName.toLowerCase();
  [...el.classList].forEach(c=>{ if(!STATE_CLS.has(c) && /^[a-zA-Z_][\w-]*$/.test(c)) s += '.'+c; });
  ['data-a','data-d','data-c','data-in','data-t','data-m'].forEach(a=>{ if(el.hasAttribute(a)) s += `[${a}=${q(el.getAttribute(a))}]`; });
  if(el.hasAttribute('data-a') && el.hasAttribute('data-v') && !/^\d+$/.test(el.getAttribute('data-v'))) s += `[data-v=${q(el.getAttribute('data-v'))}]`;
  if(!noNth && el.parentElement){ let same = 0; try{ same = [...el.parentElement.children].filter(c=>c.matches(s)).length; }catch(x){ same = 2; } if(same>1){ const i = [...el.parentElement.children].filter(c=>c.nodeName===el.nodeName).indexOf(el)+1; s += `:nth-of-type(${i})`; } }
  return s;
}
function selOf(el, likeAll){ const parts = []; let e = el, first = true; while(e && e!==doc.body && e!==doc.documentElement){ if(e.id && !/^dz/.test(e.id)){ parts.unshift('#'+W.CSS.escape(e.id)); break; } parts.unshift(step(e, first && likeAll)); if(e.nodeName==='DZ-EL') break; first = false; e = e.parentElement; } return parts.join(' > '); }
const scopeSel = s => s ? `body[data-scr="${s}"] ` : '';
const inPhone = el => !!(el && el.closest && el.closest('#phone'));
function scopeOf(el){ return (!wide && inPhone(el)) ? (doc.body.dataset.scr||'') : ''; }

// ---------- 고르기 ----------
function pick(el, keep){ cur = el; if(!keep){ all = false; wide = false; } if(el){ el._sel = selOf(el, all); el._scope = scopeOf(el); } frameBox(); if(hov) hov.style.display='none'; panel(); }
function refreshSel(){ if(cur){ cur._sel = selOf(cur, all); cur._scope = scopeOf(cur); } }

// ---------- 바꾼 내용 저장 ----------
function commit(){ try{ localStorage.setItem(W.Design.DRAFT, JSON.stringify(D)); }catch(e){} W.Design.set(JSON.parse(JSON.stringify(D))); setTimeout(frameBox, 30); btns(); }
function snap(){ undo.push(JSON.stringify(D)); if(undo.length>80) undo.shift(); redo = []; }
function btns(){ $('#undo').disabled = !undo.length; $('#redo').disabled = !redo.length; }
function addOf(el){ return el && el.nodeName==='DZ-EL' ? D.add.find(a=>a.id===el.dataset.dz) : null; }
function ruleOf(make){ const a = addOf(cur); if(a) return a; let r = D.css.find(r=>r.sel===cur._sel && (r.scope||'')===cur._scope); if(!r && make){ r = {scope:cur._scope, sel:cur._sel, p:{}}; D.css.push(r); } return r; }
function setProp(k, v){ if(!cur) return; snap(); const r = ruleOf(true); if(!r.p) r.p = {}; if(v===null || v==='' || v===undefined) delete r.p[k]; else r.p[k] = v; if(!addOf(cur) && !Object.keys(r.p).length) D.css = D.css.filter(x=>x!==r); commit(); }
function getProp(k){ const r = cur && ruleOf(false); return r && r.p ? r.p[k] : undefined; }

// ---------- 오른쪽 패널 ----------
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hex(c){ const m = /rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(c||''); if(!m) return '#000000'; return '#'+[1,2,3].map(i=>(+m[i]).toString(16).padStart(2,'0')).join(''); }
const px = v => { const n = parseFloat(v); return isNaN(n) ? '' : Math.round(n*10)/10; };
function textNodes(el){ const out = []; const w = doc.createTreeWalker(el, NodeFilter.SHOW_TEXT); let n; while((n = w.nextNode()) && out.length<8){ if(n.nodeValue.trim() && !/^(SCRIPT|STYLE)$/.test(n.parentNode.nodeName)) out.push(n); } return out; }
function nameOf(el){ if(el.nodeName==='DZ-EL') return '내가 넣은 ' + ({text:'글',btn:'단추',box:'상자',img:'이미지',line:'구분선'}[el.dataset.k]||'요소'); const t = (el.textContent||'').trim().replace(/\s+/g,' ').slice(0,22); const kind = /^(BUTTON)$/.test(el.nodeName)||el.hasAttribute('data-a') ? '단추' : /^(IMG|SVG)$/i.test(el.nodeName) ? '그림' : /^(H\d|P|SPAN|B|I|SMALL|LABEL|EM)$/.test(el.nodeName) ? '글' : '상자'; return kind + (t ? ` “${t}”` : ''); }

function panel(){
  btns();
  if(mode!=='edit'){ side.innerHTML = `<div class="empty">지금은 <b>앱 사용하기</b> 상태예요.<br>고치고 싶은 화면까지 간 뒤<br>위의 <b>고치기</b>를 누르세요.</div>${changes()}`; bindChanges(); return; }
  if(!cur){ side.innerHTML = `<div class="empty">화면에서 고칠 요소를 누르세요.</div>${changes()}`; bindChanges(); return; }
  const cs = W.getComputedStyle(cur), a = addOf(cur), r = ruleOf(false), P = (r && r.p) || {};
  const par = cur.parentElement, pd = par ? W.getComputedStyle(par).display : '', canOrder = /flex|grid/.test(pd);
  const [tx,ty] = getTr(cur);
  const tn = a ? [] : textNodes(cur);
  const four = (k) => `<div class="four">${['top','right','bottom','left'].map(s=>`<input type="number" data-p="${k}-${s}" value="${px(cs[k+'-'+s] || cs.getPropertyValue(k+'-'+s))}" title="${({top:'위',right:'오른쪽',bottom:'아래',left:'왼쪽'})[s]}">`).join('')}</div>`;
  side.innerHTML = `
  <div class="sel"><b>${esc(nameOf(cur))}</b><code>${esc(cur._scope ? '['+cur._scope+'] ' : '')}${esc(cur._sel)}</code></div>
  <div class="row" style="margin-top:8px"><button class="btn" id="up" ${par && par!==doc.body ? '' : 'disabled'}>⬆ 바깥 상자 고르기</button><button class="btn" id="unsel">고르기 풀기</button></div>
  ${a ? '' : `<div class="row"><label><input type="checkbox" id="all" ${all?'checked':''}> 같은 종류 모두</label>${inPhone(cur) ? `<label style="width:auto"><input type="checkbox" id="wide" ${wide?'checked':''}> 모든 화면에</label>` : ''}</div>`}

  <h2>글자</h2>
  ${a && (a.kind==='text'||a.kind==='btn') ? `<div class="row"><label>내용</label><textarea data-add="text">${esc(a.text||'')}</textarea></div>` : ''}
  ${tn.map((n,i)=>`<div class="row"><label>내용${tn.length>1?' '+(i+1):''}</label><textarea data-tn="${i}">${esc(n.nodeValue.trim())}</textarea></div>`).join('')}
  <div class="row"><label>크기</label><input type="number" data-p="font-size" min="6" value="${px(cs.fontSize)}"><label style="width:auto">굵기</label><select data-p="font-weight" data-raw>${[300,400,500,600,700,800].map(w=>`<option ${+cs.fontWeight===w?'selected':''}>${w}</option>`).join('')}</select></div>
  <div class="row"><label>글자색</label><input type="color" data-p="color" data-raw value="${hex(cs.color)}"><label style="width:auto">정렬</label><select data-p="text-align" data-raw>${[['left','왼쪽'],['center','가운데'],['right','오른쪽']].map(([v,t])=>`<option value="${v}" ${cs.textAlign===v||(v==='left'&&cs.textAlign==='start')?'selected':''}>${t}</option>`).join('')}</select></div>

  <h2>색 · 모양</h2>
  <div class="row"><label>배경색</label><input type="color" data-p="background-color" data-raw value="${hex(cs.backgroundColor)}"><button class="btn" data-set="background" data-val="transparent">투명</button><button class="btn" data-clear="background-color,background">원래대로</button></div>
  <div class="row"><label>테두리</label><input type="number" data-bw min="0" value="${px(cs.borderTopWidth)}" title="두께"><input type="color" data-bc value="${hex(cs.borderTopColor)}"></div>
  <div class="row"><label>모서리</label><input type="number" data-p="border-radius" min="0" value="${px(cs.borderTopLeftRadius)}"><label style="width:auto">그림자</label><select data-shadow><option value="">그대로</option><option value="none">없음</option><option value="0 2px 8px rgba(0,0,0,.15)">약하게</option><option value="0 8px 24px rgba(0,0,0,.28)">진하게</option></select></div>
  <div class="row"><label>투명도</label><input type="range" min="0" max="1" step="0.05" data-p="opacity" data-raw value="${cs.opacity}"></div>

  <h2>위치 · 크기 · 간격</h2>
  <div class="mini">고른 요소를 화면에서 끌어서 옮길 수 있어요.</div>
  <div class="row"><label>옮기기</label><input type="number" id="tx" value="${Math.round(tx)}" title="가로"><input type="number" id="ty" value="${Math.round(ty)}" title="세로"><button class="x" data-clear="translate" title="제자리로">↺</button></div>
  <div class="row"><label>너비 / 높이</label><input type="number" data-p="width" min="0" placeholder="${px(cs.width)}" value="${P.width?px(P.width):''}"><input type="number" data-p="height" min="0" placeholder="${px(cs.height)}" value="${P.height?px(P.height):''}"></div>
  <div class="row"><label>바깥 여백</label>${four('margin')}</div>
  <div class="row"><label>안쪽 여백</label>${four('padding')}</div>
  <div class="row"><label>사이 간격</label><input type="number" data-p="gap" min="0" value="${px(cs.rowGap)}" ${/flex|grid/.test(cs.display)?'':'disabled title="안에 든 것들을 나란히 놓는 상자에서만 쓸 수 있어요"'}></div>
  <div class="row"><label>순서</label><button class="btn" data-ord="-1" ${canOrder?'':'disabled'}>앞으로</button><button class="btn" data-ord="1" ${canOrder?'':'disabled'}>뒤로</button><span class="mini">${canOrder ? (P.order!==undefined?P.order:'0') : '이 자리는 순서를 못 바꿔요'}</span></div>
  <div class="row"><button class="btn" id="hideB">${a ? '🗑 지우기' : (P.display==='none' ? '다시 보이기' : '🙈 빼기(숨기기)')}</button><button class="btn" id="resetB">이 요소 원래대로</button></div>

  ${a ? `<h2>단추 동작</h2>
  <div class="row"><label>누르면 안내</label><input type="text" data-add="toast" placeholder="예: 준비 중이에요" value="${esc(a.toast||'')}"></div>
  <div class="row"><button class="btn" id="copyAct">다른 단추의 동작 가져오기</button><span class="mini">${a.attrs && Object.keys(a.attrs).length ? '가져옴: '+esc(Object.values(a.attrs).join(' ')) : ''}</span></div>` : ''}

  <h2>새로 넣기</h2>
  <div class="row"><label>어디에</label><select id="where"><option value="after">고른 요소 뒤에</option><option value="before">고른 요소 앞에</option><option value="end">고른 요소 안쪽 끝에</option><option value="start">고른 요소 안쪽 처음에</option></select></div>
  <div class="chips"><button class="btn" data-new="text">글</button><button class="btn" data-new="btn">단추</button><button class="btn" data-new="box">상자</button><button class="btn" data-new="img">이미지</button><button class="btn" data-new="line">구분선</button></div>
  <input type="file" id="imgF" accept="image/*" hidden>
  ${changes()}`;
  bind();
}
function changes(){
  const lab = r => Object.entries(r.p||{}).map(([k,v])=>k==='display'&&v==='none'?'숨김':k==='translate'?'옮김':k).join(', ');
  const items = [
    ...D.css.map((r,i)=>`<div class="item"><span data-go="css:${i}">${r.scope?`<em>[${esc(r.scope)}]</em> `:''}${esc(r.sel.split(' > ').slice(-2).join(' > '))}<br><em>${esc(lab(r))}</em></span><button class="x" data-del="css:${i}">✕</button></div>`),
    ...D.text.map((t,i)=>`<div class="item"><span>${t.scope?`<em>[${esc(t.scope)}]</em> `:''}“${esc(t.from)}” → “${esc(t.to)}”</span><button class="x" data-del="text:${i}">✕</button></div>`),
    ...D.add.map((a,i)=>`<div class="item"><span data-go="add:${i}">${a.scope?`<em>[${esc(a.scope)}]</em> `:''}넣은 ${({text:'글',btn:'단추',box:'상자',img:'이미지',line:'구분선'})[a.kind]}${a.text?` “${esc(a.text.slice(0,18))}”`:''}</span><button class="x" data-del="add:${i}">✕</button></div>`)];
  return `<h2>바꾼 것 (${items.length})</h2>${items.length ? `<div class="list">${items.join('')}</div><div class="row"><button class="btn" id="wipe">전부 원래대로</button></div>` : '<div class="mini">아직 바꾼 것이 없어요.</div>'}`;
}
function bindChanges(){
  side.querySelectorAll('[data-del]').forEach(b=>b.onclick = ()=>{ const [k,i] = b.dataset.del.split(':'); snap(); D[k].splice(+i,1); commit(); panel(); });
  side.querySelectorAll('[data-go]').forEach(b=>b.onclick = ()=>{ const [k,i] = b.dataset.go.split(':'); const r = D[k][+i]; let e = null; try{ e = doc.querySelector(k==='add' ? `dz-el[data-dz="${r.id}"]` : scopeSel(r.scope)+r.sel); }catch(x){} if(!e){ hint('이 요소는 지금 화면에 없어요. [앱 사용하기]로 그 화면에 가면 고를 수 있어요.'); return; } if(mode!=='edit') setMode('edit'); wide = !r.scope && inPhone(e); all = k==='css' && selOf(e,true)===r.sel && selOf(e,false)!==r.sel; cur = e; refreshSel(); frameBox(); panel(); });
  const w = side.querySelector('#wipe'); if(w) w.onclick = ()=>{ if(!confirm('바꾼 것을 전부 지우고 원래 디자인으로 돌릴까요?')) return; snap(); D = {v:1,css:[],text:[],add:[]}; commit(); pick(null); };
}
function bind(){
  bindChanges();
  const on = (s, ev, f) => side.querySelectorAll(s).forEach(e=>e.addEventListener(ev, ()=>f(e)));
  $('#up').onclick = ()=>{ if(cur.parentElement) pick(cur.parentElement); };
  $('#unsel').onclick = ()=>pick(null);
  const al = $('#all'); if(al) al.onchange = ()=>{ all = al.checked; refreshSel(); panel(); };
  const wd = $('#wide'); if(wd) wd.onchange = ()=>{ wide = wd.checked; refreshSel(); panel(); };
  on('[data-p]', 'change', e=>{ const k = e.dataset.p; let v = e.value; if(v!=='' && !e.hasAttribute('data-raw')) v = v+'px'; setProp(k, v); if(e.type!=='range') panel(); });
  on('[data-p][type=range],[data-p][type=color]', 'input', e=>{ cur.style.setProperty(e.dataset.p, e.value, 'important'); });
  on('[data-p][type=range],[data-p][type=color]', 'change', e=>{ cur.style.removeProperty(e.dataset.p); });
  on('[data-set]', 'click', e=>{ setProp(e.dataset.set, e.dataset.val); panel(); });
  on('[data-clear]', 'click', e=>{ e.dataset.clear.split(',').forEach(k=>setProp(k, null)); panel(); });
  const bw = side.querySelector('[data-bw]'), bc = side.querySelector('[data-bc]');
  const border = ()=>{ setProp('border', `${bw.value||0}px solid ${bc.value}`); panel(); }; bw.onchange = border; bc.onchange = border;
  side.querySelector('[data-shadow]').onchange = e=>{ setProp('box-shadow', e.target.value || null); };
  const tr = ()=>{ setProp('translate', `${+$('#tx').value||0}px ${+$('#ty').value||0}px`); }; $('#tx').onchange = tr; $('#ty').onchange = tr;
  on('[data-ord]', 'click', e=>{ const now = parseInt(getProp('order')||'0',10)||0; setProp('order', String(now + (+e.dataset.ord))); panel(); });
  on('[data-tn]', 'change', e=>{ const n = textNodes(cur)[+e.dataset.tn]; if(!n) return; const shown = n.nodeValue.trim(), from = n._dzo !== undefined ? n._dzo : shown, to = e.value.trim(); const sc = scopeOf(cur); snap(); D.text = D.text.filter(t=>!(t.from===from && (t.scope||'')===sc)); if(to && to!==from) D.text.push({scope:sc, from, to}); commit(); panel(); });
  on('[data-add]', 'change', e=>{ const a = addOf(cur); if(!a) return; snap(); a[e.dataset.add] = e.value; commit(); });
  $('#hideB').onclick = ()=>{ const a = addOf(cur); if(a){ snap(); D.add = D.add.filter(x=>x!==a); commit(); pick(null); return; } setProp('display', getProp('display')==='none' ? null : 'none'); if(getProp('display')==='none'){ hint('뺐어요. 아래 [바꾼 것] 목록에서 ✕ 를 누르면 다시 나타나요.'); pick(null); } else panel(); };
  $('#resetB').onclick = ()=>{ const a = addOf(cur); snap(); if(a){ a.p = defStyle(a.kind); } else { D.css = D.css.filter(r=>!(r.sel===cur._sel && (r.scope||'')===cur._scope)); } commit(); panel(); };
  const ca = $('#copyAct'); if(ca) ca.onclick = ()=>{ hint('동작을 가져올 단추를 화면에서 누르세요.'); const mine = cur; const h = e=>{ e.preventDefault(); e.stopImmediatePropagation(); doc.removeEventListener('pointerdown', h, true); const t = doc.elementFromPoint(e.clientX, e.clientY); const b = t && t.closest('[data-a],[data-d],[data-c]'); const a = addOf(mine); if(b && a){ snap(); a.attrs = {}; ['data-a','data-v','data-i','data-d','data-c'].forEach(k=>{ if(b.hasAttribute(k)) a.attrs[k] = b.getAttribute(k); }); commit(); hint('동작을 가져왔어요. [앱 사용하기]에서 눌러 확인해 보세요.'); } else hint('그건 동작이 있는 단추가 아니에요.'); cur = mine; panel(); }; doc.addEventListener('pointerdown', h, true); };
  on('[data-new]', 'click', e=>{ const k = e.dataset.new; if(k==='img'){ $('#imgF').click(); return; } addNew(k); });
  $('#imgF').onchange = e=>{ const f = e.target.files[0]; if(!f) return; const im = new Image(), rd = new FileReader(); rd.onload = ()=>{ im.onload = ()=>{ const m = Math.min(1, 800/Math.max(im.width, im.height)); const c = document.createElement('canvas'); c.width = Math.round(im.width*m); c.height = Math.round(im.height*m); c.getContext('2d').drawImage(im,0,0,c.width,c.height); addNew('img', c.toDataURL(/png/.test(f.type)?'image/png':'image/jpeg', .85)); }; im.src = rd.result; }; rd.readAsDataURL(f); };
}
function defStyle(k){ return ({text:{'font-size':'14px','color':'#26302a','padding':'4px 0'}, btn:{'font-size':'14px','font-weight':'600','color':'#ffffff','background':'#2f5d50','border-radius':'14px','padding':'12px 16px','margin':'8px 0'}, box:{'background':'#ffffff','border-radius':'16px','height':'80px','margin':'8px 0'}, img:{'width':'160px','margin':'8px 0','border-radius':'12px'}, line:{'height':'1px','background':'#c9d2cb','margin':'10px 0'}})[k]; }
function addNew(kind, src){ if(!cur) return; const where = $('#where').value; const id = 'n'+Date.now().toString(36); snap(); const a = {id, scope:scopeOf(cur), anchor:scopeSel(scopeOf(cur))+selOf(cur,false), where, kind, text: kind==='text' ? '새 글' : kind==='btn' ? '새 단추' : '', p:defStyle(kind)}; if(src) a.src = src; D.add.push(a); commit(); setTimeout(()=>{ const e = doc.querySelector(`dz-el[data-dz="${id}"]`); if(e) pick(e); else hint('넣을 자리를 찾지 못했어요. 다른 요소를 골라 다시 해 보세요.'); }, 60); }

// ---------- 위쪽 단추 ----------
document.querySelectorAll('#dev button').forEach(b=>b.onclick = ()=>{ dev = b.dataset.d; localStorage.setItem('dz-dev', dev); open(); setMode('use'); });
document.querySelectorAll('#mode button').forEach(b=>b.onclick = ()=>setMode(b.dataset.m));
$('#reload').onclick = ()=>{ open(); setMode('use'); };
$('#jump').onclick = ()=>{ try{ W.eval(`try{ Intro.close(); }catch(e){} if(S.screen!=='main'){ if(S.screen==='login'){ act('fill'); act('login'); } if(S.screen==='teamLink') act('teamNext'); if(S.screen==='clip'||S.screen==='clipLink') act('clipNext'); try{ act('clipNext'); }catch(e){} if(S.screen!=='main'){ act(IS_CS?'pickMgr':'pickPartner'); } if(S.screen==='mHome'){ S.screen='main'; S.tab=null; render(); } if(S.screen!=='main' && !IS_CS){ S.propIn=true; act('propOk'); act('toBar'); } }`); }catch(e){ hint('건너뛰지 못했어요. [앱 사용하기]로 직접 눌러서 가 주세요.'); } pick(null); };
$('#undo').onclick = ()=>{ if(!undo.length) return; redo.push(JSON.stringify(D)); D = JSON.parse(undo.pop()); commit(); pick(null); };
$('#redo').onclick = ()=>{ if(!redo.length) return; undo.push(JSON.stringify(D)); D = JSON.parse(redo.pop()); commit(); pick(null); };
addEventListener('keydown', e=>{ if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='z' && !/INPUT|TEXTAREA/.test(document.activeElement.nodeName)){ e.preventDefault(); (e.shiftKey ? $('#redo') : $('#undo')).click(); } if(e.key==='Escape') pick(null); });
$('#exp').onclick = ()=>{ const name = `design-${dev}.json`; const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(D, null, 1)], {type:'application/json'})); a.download = name; a.click();
  const dlg = $('#dlg'); dlg.innerHTML = `<h3 style="margin-top:0">${name} 을 받았어요</h3><p>이 파일이 바꾼 내용 전부예요. 실제 ${dev==='cs'?'아이패드':'아이폰'} 앱에 반영하려면 둘 중 하나를 하세요.</p><ol><li><b>Claude 에게 파일을 보내기</b> — 대화창에 올리고 "반영해줘"라고 하면 돼요.</li><li><b>직접 올리기</b> — 깃허브 저장소에서 Add file → Upload files 로 이 파일을 맨 위 폴더에 올리고 Commit. 1~2분 뒤 앱을 완전히 닫았다 열면 바뀌어요.</li></ol><p class="mini">파일 이름은 바꾸지 마세요. 원래 디자인으로 돌아가려면 저장소에서 이 파일을 지우면 돼요.</p><div style="text-align:right"><button class="btn prim" onclick="this.closest('dialog').close()">확인</button></div>`; dlg.showModal(); };
$('#imp').onclick = ()=>$('#impF').click();
$('#impF').onchange = e=>{ const f = e.target.files[0]; if(!f) return; const rd = new FileReader(); rd.onload = ()=>{ try{ const j = JSON.parse(rd.result); if(!j || !Array.isArray(j.css)) throw 0; snap(); D = Object.assign({v:1,css:[],text:[],add:[]}, j); commit(); pick(null); hint('불러왔어요.'); }catch(x){ hint('이 파일은 디자인 저장 파일이 아니에요.'); } }; rd.readAsText(f); e.target.value=''; };

open(); setMode('use');
</script>
</body>
